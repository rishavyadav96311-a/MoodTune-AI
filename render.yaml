services:
  - type: web
    name: moodtune-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: HF_EMOTION_MODEL
        value: j-hartmann/emotion-english-distilroberta-base
      - key: ALLOWED_ORIGINS
        value: "*"
